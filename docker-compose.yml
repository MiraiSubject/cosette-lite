version: '3'
services:
  cosette-lite:
    restart: always
    build:
      context: .
      dockerfile: ./apps/webstack/Dockerfile
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: production
      PUBLIC_DISCORD_CLIENT_ID:
      DISCORD_CLIENT_SECRET:
      DISCORD_GUILD_ID:
      DISCORD_BOT_TOKEN:
      PUBLIC_OSU2_CLIENT_ID:
      OSU2_CLIENT_SECRET:
      PRIVATE_COOKIE_SECRET:

